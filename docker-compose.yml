services:
  postgres-db:
    image: postgres:16-alpine
    container_name: dynamic-price-db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=adminpass
      - POSTGRES_DB=dynamic_pricing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pricing-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-panel
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=adminpass
    ports:
      - "8081:80"
    depends_on:
      - postgres-db
    networks:
      - pricing-network

networks:
  pricing-network:
    driver: bridge

volumes:
  postgres_data: