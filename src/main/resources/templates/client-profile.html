<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments-client :: head('Mój Profil')}"></head>
<body id="page-top">
<div id="wrapper">
    <ul th:replace="~{fragments-client :: sidebar}"></ul>
    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <nav th:replace="~{fragments-client :: topbar}"></nav>
            <div class="container-fluid">
                <h1 class="h3 mb-4 text-gray-800">Ustawienia Profilu</h1>

                <div class="row">
                    <div class="col-lg-6">
                        <div class="card shadow mb-4">
                            <div class="card-header py-3">
                                <h6 class="m-0 font-weight-bold text-info">Twoje Dane</h6>
                            </div>
                            <div class="card-body">
                                <div th:if="${param.success}" class="alert alert-success">Zapisano pomyślnie!</div>

                                <form th:action="@{/client/profile}" method="post">
                                    <div class="form-group">
                                        <label>Email (Login)</label>
                                        <input type="text" class="form-control bg-light" th:value="${user.email}" readonly>
                                    </div>
                                    <div class="form-group">
                                        <label>Imię</label>
                                        <input type="text" name="firstName" class="form-control" th:value="${user.firstName}" required>
                                    </div>
                                    <div class="form-group">
                                        <label>Nazwisko</label>
                                        <input type="text" name="lastName" class="form-control" th:value="${user.lastName}" required>
                                    </div>
                                    <div class="form-group">
                                        <label>Telefon</label>
                                        <input type="text" name="phoneNumber" class="form-control" th:value="${user.phoneNumber}" required>
                                    </div>
                                    <button type="submit" class="btn btn-info btn-icon-split">
                                        <span class="icon text-white-50"><i class="fas fa-check"></i></span>
                                        <span class="text">Zapisz profil</span>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments-client :: scripts}"></div>
</body>
</html>
