<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments-client :: head('My profile')}"></head>
<body id="page-top">
<div id="wrapper">
    <ul th:replace="~{fragments-client :: sidebar}"></ul>
    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <nav th:replace="~{fragments-client :: topbar}"></nav>
            <div class="container-fluid">
                <h1 class="h3 mb-4 text-gray-800">Profile</h1>

                <div class="row">
                    <div class="col-lg-6">
                        <div class="card shadow mb-4">
                            <div class="card-header py-3">
                                <h6 class="m-0 font-weight-bold text-primary">Your credentials</h6>
                            </div>
                            <div class="card-body">
                                <div th:if="${param.success}" class="alert alert-success">Saved successfully.</div>

                                <form th:action="@{/client/profile}" th:object="${profileUpdate}" method="post">
                                    <th:block th:replace="~{fragments-common :: csrf}"/>
                                    <div class="form-group">
                                        <label>Email (login)</label>
                                        <input type="text" class="form-control bg-light" th:value="${userProfile.email}" readonly>
                                    </div>
                                    <div class="form-group">
                                        <label>First name</label>
                                        <input type="text" class="form-control" th:field="*{firstName}" th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'">
                                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                                    </div>
                                    <div class="form-group">
                                        <label>Last name</label>
                                        <input type="text" class="form-control" th:field="*{lastName}" th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'">
                                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                                    </div>
                                    <div class="form-group">
                                        <label>Phone</label>
                                        <input type="text" class="form-control" th:field="*{phoneNumber}" placeholder="Opcjonalnie">
                                    </div>
                                    <button type="submit" class="btn btn-primary btn-icon-split">
                                        <span class="icon text-white-50"><i class="fas fa-check"></i></span>
                                        <span class="text">Save profile</span>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments-client :: scripts}"></div>
</body>
</html>
