<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title th:text="${title}">Saloon Admin</title>
    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">
</head>

<ul th:fragment="sidebar" class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">

    <a class="sidebar-brand d-flex align-items-center justify-content-center" th:href="@{/admin}">
        <div class="sidebar-brand-icon rotate-n-15">
            <i class="fas fa-cut"></i>
        </div>
        <div class="sidebar-brand-text mx-3">Saloon Manager</div>
    </a>

    <hr class="sidebar-divider my-0">

    <li class="nav-item" th:classappend="${activeTab == 'dashboard' ? 'active' : ''}">
        <a class="nav-link" th:href="@{/admin}">
            <i class="fas fa-fw fa-tachometer-alt"></i>
            <span>Dashboard</span>
        </a>
    </li>

    <hr class="sidebar-divider">

    <div class="sidebar-heading">Management</div>

    <li class="nav-item" th:classappend="${activeTab == 'services' ? 'active' : ''}">
        <a class="nav-link" th:href="@{/admin/services}">
            <i class="fas fa-fw fa-concierge-bell"></i>
            <span>Services</span>
        </a>
    </li>

    <li class="nav-item" th:classappend="${activeTab == 'employees' ? 'active' : ''}">
        <a class="nav-link" th:href="@{/admin/employees}">
            <i class="fas fa-fw fa-users"></i>
            <span>Employees</span>
        </a>
    </li>

    <li class="nav-item" th:classappend="${activeTab == 'reservations' ? 'active' : ''}">
        <a class="nav-link" th:href="@{/admin/reservations}">
            <i class="fas fa-fw fa-calendar-alt"></i>
            <span>Reservations</span>
        </a>
    </li>

    <li class="nav-item" th:classappend="${activeTab == 'pricing' ? 'active' : ''}">
        <a class="nav-link" th:href="@{/admin/pricing}">
            <i class="fas fa-fw fa-percentage"></i>
            <span>Dynamic pricing</span>
        </a>
    </li>

    <hr class="sidebar-divider d-none d-md-block">
    <div class="text-center d-none d-md-inline">
        <button class="rounded-circle border-0" id="sidebarToggle"></button>
    </div>
</ul>

<nav th:fragment="topbar" class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
    <form id="adminLogoutForm" th:action="@{/logout}" method="post" class="d-none">
        <th:block th:replace="~{fragments-common :: csrf}"/>
    </form>
    <ul class="navbar-nav ml-auto">
        <li class="nav-item dropdown no-arrow">
            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                <span class="mr-2 d-none d-lg-inline text-gray-600 small" sec:authentication="name">Admin</span>
                <img class="img-profile rounded-circle" th:src="@{/img/undraw_profile.svg}" alt="">
            </a>
            <div class="dropdown-menu dropdown-menu-right shadow animated--grow-in" aria-labelledby="userDropdown">
                <button type="button" class="dropdown-item" id="adminLogoutBtn">
                    <i class="fas fa-sign-out-alt fa-sm fa-fw mr-2 text-gray-400"></i> Log out
                </button>
            </div>
        </li>
    </ul>
</nav>

<div th:fragment="scripts">
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var btn = document.getElementById('adminLogoutBtn');
            if (btn) {
                btn.addEventListener('click', function (e) {
                    e.preventDefault();
                    document.getElementById('adminLogoutForm').submit();
                });
            }
        });
    </script>
</div>
</html>
