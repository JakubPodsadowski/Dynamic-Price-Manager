<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments-admin :: head('Service management')}"></head>
<body id="page-top">
<div id="wrapper">
    <ul th:replace="~{fragments-admin :: sidebar}"></ul>
    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <nav th:replace="~{fragments-admin :: topbar}"></nav>
            <div class="container-fluid">
                <div class="d-sm-flex align-items-center justify-content-between mb-4">
                    <h1 class="h3 mb-0 text-gray-800">Services</h1>
                    <button class="btn btn-primary shadow-sm" data-toggle="modal" data-target="#addServiceModal">
                        <i class="fas fa-plus fa-sm"></i> Add service
                    </button>
                </div>

                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${error}"></span>
                    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>

                <div th:if="${serviceFormSaveErrors != null && !serviceFormSaveErrors.isEmpty()}"
                     class="alert alert-danger alert-dismissible fade show" role="alert">
                    <p class="mb-2 font-weight-bold">Could not save service:</p>
                    <ul class="mb-0 pl-3 small">
                        <li th:each="msg : ${serviceFormSaveErrors}" th:text="${msg}"></li>
                    </ul>
                    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>

                <div class="card shadow mb-4">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered" width="100%" cellspacing="0">
                                <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Price (PLN)</th>
                                    <th>Duration (min)</th>
                                    <th>Description</th>
                                    <th>Actions</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="s : ${services}">
                                    <td th:text="${s.name}"></td>
                                    <td th:text="${s.price}"></td>
                                    <td th:text="${s.duration}"></td>
                                    <td th:text="${s.description}"></td>
                                    <td>
                                        <div class="btn-group">
                                            <button type="button" class="btn btn-warning btn-sm" data-toggle="modal" th:data-target="'#editModal'+${s.id}">
                                                <i class="fas fa-edit"></i> Edit
                                            </button>
                                            <form th:action="@{/admin/services/delete/{id}(id=${s.id})}" method="post" style="display:inline"
                                                  onsubmit="return confirm('Are you sure you want to delete this service?')">
                                                <th:block th:replace="~{fragments-common :: csrf}"/>
                                                <button class="btn btn-danger btn-sm" type="submit">
                                                    <i class="fas fa-trash"></i> Delete
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <th:block th:each="s : ${services}">
                    <div class="modal fade" th:id="'editModal' + ${s.id}" tabindex="-1" role="dialog" aria-hidden="true">
                        <div class="modal-dialog" role="document">
                            <div class="modal-content">
                                <th:block th:with="ef=${failedEditServiceForm != null and reopenEditServiceId != null and reopenEditServiceId == s.id ? failedEditServiceForm : null}">
                                <form th:action="@{/admin/services/edit}" method="post">
                                    <th:block th:replace="~{fragments-common :: csrf}"/>
                                    <div class="modal-header">
                                        <h5 class="modal-title">Edit service</h5>
                                        <button class="close" type="button" data-dismiss="modal"><span>&times;</span></button>
                                    </div>
                                    <div class="modal-body">
                                        <input type="hidden" name="id" th:value="${ef != null and ef.id != null ? ef.id : s.id}">
                                        <div class="form-group">
                                            <label>Name</label>
                                            <input type="text" name="name" th:value="${ef != null ? ef.name : s.name}" class="form-control" required>
                                        </div>
                                        <div class="form-group">
                                            <label>Price (PLN)</label>
                                            <input type="number" step="0.01" name="price" lang="en"
                                                   th:value="${ef != null and ef.price != null ? #numbers.formatDecimal(ef.price, 1, 2, 'POINT') : (s.price != null ? #numbers.formatDecimal(s.price, 1, 2, 'POINT') : '')}"
                                                   class="form-control" min="0" required>
                                        </div>
                                        <div class="form-group">
                                            <label>Description</label>
                                            <textarea name="description" class="form-control" rows="3"
                                                      th:text="${ef != null ? (ef.description != null ? ef.description : '') : (s.description != null ? s.description : '')}"></textarea>
                                        </div>
                                        <div class="form-group">
                                            <label>Duration (min)</label>
                                            <input type="number" name="duration" th:value="${ef != null and ef.duration != null ? ef.duration : s.duration}" class="form-control" min="1" required>
                                        </div>
                                    </div>
                                    <div class="modal-footer">
                                        <button class="btn btn-secondary" type="button" data-dismiss="modal">Cancel</button>
                                        <button type="submit" class="btn btn-primary">Save</button>
                                    </div>
                                </form>
                                </th:block>
                            </div>
                        </div>
                    </div>
                </th:block>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="addServiceModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/admin/services/add}" th:object="${saloonServiceForm}" method="post">
                <th:block th:replace="~{fragments-common :: csrf}"/>
                <input type="hidden" id="hasErrors" th:value="${#fields.hasAnyErrors()}">

                <div class="modal-header">
                    <h5 class="modal-title">New service</h5>
                    <button class="close" type="button" data-dismiss="modal"><span>&times;</span></button>
                </div>
                <div class="modal-body">
                    <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger">Please fix form errors.</div>

                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>
                    <div class="form-group">
                        <label>Price (PLN)</label>
                        <input type="number" step="0.01" th:field="*{price}" class="form-control" th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'">
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea th:field="*{description}" class="form-control" rows="2" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                    </div>
                    <div class="form-group">
                        <label>Duration (min)</label>
                        <input type="number" th:field="*{duration}" class="form-control" th:classappend="${#fields.hasErrors('duration')} ? 'is-invalid'">
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('duration')}" th:errors="*{duration}"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" type="button" data-dismiss="modal">Cancel</button>
                    <button class="btn btn-primary" type="submit">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments-admin :: scripts}"></div>
<script th:inline="javascript">
    $(document).ready(function () {
        if ($('#hasErrors').val() === 'true') {
            $('#addServiceModal').modal('show');
        }
        var reopenEditServiceId = /*[[${reopenEditServiceId}]]*/ null;
        if (reopenEditServiceId) {
            $('#editModal' + reopenEditServiceId).modal('show');
        }
    });
</script>
</body>
</html>
