<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments-admin :: head('Zarządzanie Usługami')}"></head>
<body id="page-top">
<div id="wrapper">
    <ul th:replace="~{fragments-admin :: sidebar}"></ul>
    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <nav th:replace="~{fragments-admin :: topbar}"></nav>
            <div class="container-fluid">
                <div class="d-sm-flex align-items-center justify-content-between mb-4">
                    <h1 class="h3 mb-0 text-gray-800">Usługi</h1>
                    <button class="btn btn-primary shadow-sm" data-toggle="modal" data-target="#addServiceModal">
                        <i class="fas fa-plus fa-sm"></i> Dodaj Usługę
                    </button>
                </div>

                <div class="card shadow mb-4">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered" width="100%" cellspacing="0">
                                <thead>
                                <tr>
                                    <th>Nazwa</th>
                                    <th>Cena (PLN)</th>
                                    <th>Czas (min)</th>
                                    <th>Opis</th> <th>Akcje</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="s : ${services}">
                                    <td th:text="${s.name}"></td>
                                    <td th:text="${s.price}"></td>
                                    <td th:text="${s.duration}"></td>
                                    <td th:text="${s.description}"></td> <td>
                                    <div class="btn-group">
                                        <button class="btn btn-warning btn-sm" data-toggle="modal" th:data-target="'#editModal'+${s.id}">
                                            <i class="fas fa-edit"></i> Edytuj
                                        </button>
                                        <form th:action="@{/admin/services/delete/{id}(id=${s.id})}" method="post"
                                              style="display:inline" onsubmit="return confirm('Czy na pewno chcesz usunąć tę usługę?')">
                                            <button class="btn btn-danger btn-sm" type="submit">
                                                <i class="fas fa-trash"></i> Usuń
                                            </button>
                                        </form>
                                    </div>
                                </td>

                                    <div class="modal fade" th:id="'editModal' + ${s.id}" tabindex="-1" role="dialog">
                                        <div class="modal-dialog" role="document">
                                            <div class="modal-content">
                                                <div class="modal-header">
                                                    <h5 class="modal-title">Edytuj Usługę</h5>
                                                    <button class="close" type="button" data-dismiss="modal"><span>&times;</span></button>
                                                </div>
                                                <form th:action="@{/admin/services/edit}" method="post">
                                                    <div class="modal-body">
                                                        <input type="hidden" name="id" th:value="${s.id}">
                                                        <div class="form-group">
                                                            <label>Nazwa</label>
                                                            <input type="text" name="name" th:value="${s.name}" class="form-control" required>
                                                        </div>
                                                        <div class="form-group">
                                                            <label>Cena (PLN)</label>
                                                            <input type="number" step="0.01" name="price" th:value="${s.price}" class="form-control" required>
                                                        </div>
                                                        <div class="form-group">
                                                            <label>Opis usługi</label>
                                                            <textarea name="description" th:text="${s.description}" class="form-control" rows="3"></textarea>
                                                        </div>
                                                        <div class="form-group">
                                                            <label>Czas (min)</label>
                                                            <input type="number" name="duration" th:value="${s.duration}" class="form-control" required>
                                                        </div>
                                                    </div>
                                                    <div class="modal-footer">
                                                        <button class="btn btn-secondary" data-dismiss="modal">Anuluj</button>
                                                        <button type="submit" class="btn btn-primary">Zapisz zmiany</button>
                                                    </div>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </tr>
                                <tr th:if="${#lists.isEmpty(services)}">
                                    <td colspan="5" class="text-center">Brak usług w bazie danych.</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="addServiceModal" tabindex="-1" role="dialog">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/admin/addservice-ui}" method="post">
                <div class="modal-header">
                    <h5>Dodaj nową usługę</h5>
                    <button class="close" type="button" data-dismiss="modal"><span>&times;</span></button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>Nazwa</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Cena (PLN)</label>
                        <input type="number" step="0.01" name="price" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Opis</label>
                        <textarea name="description" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Czas (min)</label>
                        <input type="number" name="duration" class="form-control" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-dismiss="modal">Anuluj</button>
                    <button class="btn btn-primary" type="submit">Zapisz</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments-admin :: scripts}"></div>
</body>
</html>
