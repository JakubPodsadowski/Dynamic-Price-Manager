<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments-admin :: head('Zarządzanie Usługami')}"></head>
<body id="page-top">
<div id="wrapper">
    <ul th:replace="~{fragments-admin :: sidebar}"></ul>
    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <nav th:replace="~{fragments-admin :: topbar}"></nav>
            <div class="container-fluid">
                <div class="d-sm-flex align-items-center justify-content-between mb-4">
                    <h1 class="h3 mb-0 text-gray-800">Usługi</h1>
                    <button class="btn btn-primary shadow-sm" data-toggle="modal" data-target="#addServiceModal">
                        <i class="fas fa-plus fa-sm"></i> Dodaj Usługę
                    </button>
                </div>

                <div class="card shadow mb-4">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered" width="100%" cellspacing="0">
                                <thead>
                                <tr>
                                    <th>Nazwa</th>
                                    <th>Cena (PLN)</th>
                                    <th>Czas (min)</th>
                                    <th>Opis</th>
                                    <th>Akcje</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="s : ${services}">
                                    <td th:text="${s.name}"></td>
                                    <td th:text="${s.price}"></td>
                                    <td th:text="${s.duration}"></td>
                                    <td th:text="${s.description}"></td>
                                    <td>
                                        <div class="btn-group">
                                            <button class="btn btn-warning btn-sm" data-toggle="modal" th:data-target="'#editModal'+${s.id}">
                                                <i class="fas fa-edit"></i> Edytuj
                                            </button>
                                            <form th:action="@{/admin/services/delete/{id}(id=${s.id})}" method="post"
                                                  style="display:inline" onsubmit="return confirm('Czy na pewno chcesz usunąć tę usługę?')">
                                                <button class="btn btn-danger btn-sm" type="submit">
                                                    <i class="fas fa-trash"></i> Usuń
                                                </button>
                                            </form>
                                        </div>
                                    </td>

                                    <div class="modal fade" th:id="'editModal' + ${s.id}" tabindex="-1" role="dialog">
                                        <div class="modal-dialog" role="document">
                                            <div class="modal-content">
                                                <div class="modal-header">
                                                    <h5 class="modal-title">Edytuj Usługę</h5>
                                                    <button class="close" type="button" data-dismiss="modal"><span>&times;</span></button>
                                                </div>
                                                <form th:action="@{/admin/services/edit}" method="post">
                                                    <div class="modal-body">
                                                        <input type="hidden" name="id" th:value="${s.id}">
                                                        <div class="form-group">
                                                            <label>Nazwa</label>
                                                            <input type="text" name="name" th:value="${s.name}" class="form-control" required>
                                                        </div>
                                                        <div class="form-group">
                                                            <label>Cena (PLN)</label>
                                                            <input type="number" step="0.01" name="price" th:value="${s.price}" class="form-control" min="0" required>
                                                        </div>
                                                        <div class="form-group">
                                                            <label>Opis usługi</label>
                                                            <textarea name="description" th:text="${s.description}" class="form-control" rows="3"></textarea>
                                                        </div>
                                                        <div class="form-group">
                                                            <label>Czas (min)</label>
                                                            <input type="number" name="duration" th:value="${s.duration}" class="form-control" min="1" required>
                                                        </div>
                                                    </div>
                                                    <div class="modal-footer">
                                                        <button class="btn btn-secondary" data-dismiss="modal">Anuluj</button>
                                                        <button type="submit" class="btn btn-primary">Zapisz zmiany</button>
                                                    </div>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="addServiceModal" tabindex="-1" role="dialog">
    <div class="modal-dialog">
        <div class="modal-content" th:if="${saloonService != null}">

            <form th:action="@{/admin/services/add}" th:object="${saloonService}" method="post">
                <input type="hidden" id="hasErrors" th:value="${#fields.hasAnyErrors()}">

                <div class="modal-header">
                    <h5>Dodaj nową usługę</h5>
                    <button class="close" type="button" data-dismiss="modal"><span>&times;</span></button>
                </div>
                <div class="modal-body">
                    <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger">Popraw błędy w formularzu.</div>

                    <div class="form-group">
                        <label>Nazwa</label>
                        <input type="text" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{name}"></div>
                    </div>

                    <div class="form-group">
                        <label>Cena (PLN)</label>
                        <input type="number" step="0.01" th:field="*{price}" class="form-control" th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{price}"></div>
                    </div>

                    <div class="form-group">
                        <label>Opis</label>
                        <textarea th:field="*{description}" class="form-control" rows="2" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Czas (min)</label>
                        <input type="number" th:field="*{duration}" class="form-control" th:classappend="${#fields.hasErrors('duration')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{duration}"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" type="button" data-dismiss="modal" onclick="window.location.href='/admin/services'">Anuluj</button>
                    <button class="btn btn-primary" type="submit">Zapisz</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments-admin :: scripts}"></div>

<script>
    $(document).ready(function(){
        if ($('#hasErrors').val() === 'true') {
            $('#addServiceModal').modal('show');
        }
    });
</script>

</body>
</html>
