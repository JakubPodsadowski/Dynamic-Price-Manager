<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments-client :: head('Rezerwacja Usług')}"></head>

<body id="page-top">

<div id="wrapper">

    <ul th:replace="~{fragments-client :: sidebar}"></ul>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">

            <nav th:replace="~{fragments-client :: topbar}"></nav>

            <div class="container-fluid">

                <h1 class="h3 mb-4 text-gray-800">Dostępne Usługi</h1>

                <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    Rezerwacja została przyjęta pomyślnie!
                    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>

                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary">Wybierz usługę dla siebie</h6>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered" width="100%" cellspacing="0">
                                <thead>
                                <tr>
                                    <th>Nazwa</th>
                                    <th>Cena (PLN)</th>
                                    <th>Czas (min)</th>
                                    <th>Opis</th>
                                    <th>Akcja</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="service : ${services}">
                                    <td th:text="${service.name}" class="font-weight-bold">Nazwa</td>
                                    <td th:text="${service.price}">0.00</td>
                                    <td th:text="${service.duration}">30</td>
                                    <td th:text="${service.description}">Opis</td>
                                    <td>
                                        <a th:href="@{/client/book(serviceId=${service.id})}" class="btn btn-success btn-icon-split">
                                            <span class="icon text-white-50"><i class="fas fa-calendar-check"></i></span>
                                            <span class="text">Zarezerwuj Termin</span>
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(services)}">
                                    <td colspan="5" class="text-center">Obecnie nie mamy dostępnych usług. Zapraszamy wkrótce!</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <footer class="sticky-footer bg-white">
            <div class="container my-auto">
                <div class="copyright text-center my-auto">
                    <span>Copyright &copy; Saloon Manager 2026</span>
                </div>
            </div>
        </footer>
    </div>
</div>

<div th:replace="~{fragments-client :: scripts}"></div>

</body>
</html>
