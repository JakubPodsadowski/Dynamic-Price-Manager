<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title th:text="${title}">Saloon</title>
    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">
</head>

<head th:fragment="headBooking(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title th:text="${title}">Booking</title>
    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-datepicker@1.10.0/dist/css/bootstrap-datepicker3.min.css" crossorigin="anonymous">
</head>

<ul th:fragment="sidebar" class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">
    <a class="sidebar-brand d-flex align-items-center justify-content-center" th:href="@{/client}">
        <div class="sidebar-brand-icon rotate-n-15">
            <i class="fas fa-cut"></i>
        </div>
        <div class="sidebar-brand-text mx-3">Saloon</div>
    </a>

    <hr class="sidebar-divider my-0">

    <li class="nav-item" th:classappend="${activeTab == 'services' ? 'active' : ''}">
        <a class="nav-link" th:href="@{/client}">
            <i class="fas fa-fw fa-concierge-bell"></i>
            <span>Services</span></a>
    </li>

    <li class="nav-item" th:classappend="${activeTab == 'myReservations' ? 'active' : ''}">
        <a class="nav-link" th:href="@{/client/reservations}">
            <i class="fas fa-fw fa-calendar-check"></i>
            <span>My bookings</span></a>
    </li>

    <li class="nav-item" th:classappend="${activeTab == 'profile' ? 'active' : ''}">
        <a class="nav-link" th:href="@{/client/profile}">
            <i class="fas fa-fw fa-user"></i>
            <span>Profile</span></a>
    </li>

    <hr class="sidebar-divider d-none d-md-block">
</ul>

<nav th:fragment="topbar" class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
    <form id="clientLogoutForm" th:action="@{/logout}" method="post" class="d-none">
        <th:block th:replace="~{fragments-common :: csrf}"/>
    </form>
    <ul class="navbar-nav ml-auto">
        <li class="nav-item dropdown no-arrow">
            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                <span class="mr-2 d-none d-lg-inline text-gray-600 small" th:text="${#authentication.name}">User</span>
                <img class="img-profile rounded-circle" th:src="@{/img/undraw_profile.svg}" alt="">
            </a>
            <div class="dropdown-menu dropdown-menu-right shadow animated--grow-in" aria-labelledby="userDropdown">
                <a class="dropdown-item" th:href="@{/client/profile}">
                    <i class="fas fa-user fa-sm fa-fw mr-2 text-gray-400"></i> Profile
                </a>
                <div class="dropdown-divider"></div>
                <button type="button" class="dropdown-item" id="clientLogoutBtn">
                    <i class="fas fa-sign-out-alt fa-sm fa-fw mr-2 text-gray-400"></i> Log out
                </button>
            </div>
        </li>
    </ul>
</nav>

<div th:fragment="scripts">
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var btn = document.getElementById('clientLogoutBtn');
            if (btn) {
                btn.addEventListener('click', function (e) {
                    e.preventDefault();
                    document.getElementById('clientLogoutForm').submit();
                });
            }
        });
    </script>
</div>
</html>
