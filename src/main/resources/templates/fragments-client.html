<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title th:text="${title}">Client Panel</title>
    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">
</head>

<ul th:fragment="sidebar" class="navbar-nav bg-gradient-info sidebar sidebar-dark accordion" id="accordionSidebar">
    <a class="sidebar-brand d-flex align-items-center justify-content-center" href="/client">
        <div class="sidebar-brand-icon rotate-n-15">
            <i class="fas fa-cut"></i>
        </div>
        <div class="sidebar-brand-text mx-3">Saloon Client</div>
    </a>

    <hr class="sidebar-divider my-0">

    <li class="nav-item" th:classappend="${activeTab == 'reservation' ? 'active' : ''}">
        <a class="nav-link" th:href="@{/client}">
            <i class="fas fa-fw fa-calendar-plus"></i>
            <span>Zarezerwuj wizytę</span></a>
    </li>

    <li class="nav-item" th:classappend="${activeTab == 'profile' ? 'active' : ''}">
        <a class="nav-link" th:href="@{/client/profile}">
            <i class="fas fa-fw fa-user"></i>
            <span>Mój Profil</span></a>
    </li>

    <hr class="sidebar-divider d-none d-md-block">
</ul>

<nav th:fragment="topbar" class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
    <ul class="navbar-nav ml-auto">
        <li class="nav-item dropdown no-arrow">
            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-toggle="dropdown">
                <span class="mr-2 d-none d-lg-inline text-gray-600 small" th:text="${#authentication.name}">User</span>
                <i class="fas fa-user-circle fa-2x"></i>
            </a>
            <div class="dropdown-menu dropdown-menu-right shadow animated--grow-in">
                <a class="dropdown-item" th:href="@{/client/profile}">
                    <i class="fas fa-user fa-sm fa-fw mr-2 text-gray-400"></i> Profil
                </a>
                <div class="dropdown-divider"></div>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="dropdown-item">
                        <i class="fas fa-sign-out-alt fa-sm fa-fw mr-2 text-gray-400"></i> Wyloguj
                    </button>
                </form>
            </div>
        </li>
    </ul>
</nav>

<div th:fragment="scripts">
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
</div>

</html>
