<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments-admin :: head('Admin Dashboard')}"></head>
<body id="page-top">

                    <div class="col-xl-6 col-md-6 mb-4">
